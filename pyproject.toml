[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slamscope"
version = "0.1.0"
description = "Particle-filter localization and occupancy mapping, in your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Krishna Mahajan" }]
keywords = ["slam", "mcl", "particle-filter", "robotics", "lidar", "occupancy-grid", "tui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["textual>=0.60", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
slamscope = "slamscope.cli:main"

[project.urls]
Homepage = "https://github.com/kris072008/slamscope"
Issues = "https://github.com/kris072008/slamscope/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/slamscope"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
